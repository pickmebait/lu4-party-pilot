<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Трекер экипировки пати, общей казны и хотелок для Lineage 2"
    />
    <title>Const Party Pilot — трекер пати для Lineage 2</title>
    <!--
      Палитра ставится до первой отрисовки.

      Скрипт приложения задаёт оформление, когда модуль загрузится, и до того
      момента страница рисуется в стандартной палитре: при входе человек
      видел вспышку чужих цветов, а потом уже свои. Скрипт здесь маленький и
      синхронный, он отрабатывает раньше, чем браузер нарисует что-либо.

      Список палитр продублирован здесь намеренно — взять его из модуля до
      загрузки нельзя, а тянуть модуль ради цвета рано. Список сверяется
      проверкой: scripts/check-palette-html.mjs идёт в npm test и падает, если
      здесь и в src/lib/palette.ts разошлись.
    -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('pp:palette')
          if (v && ['gold', 'blood', 'emerald', 'ice', 'amethyst', 'coal'].indexOf(v) !== -1) {
            document.documentElement.dataset.palette = v
          }
        } catch (e) {
          /* приватный режим — останется палитра по умолчанию */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
